services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: local-dev-only-change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d capstone"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./app/api
    environment:
      DB_HOST: db
      DB_NAME: capstone
      DB_USER: capstone
      DB_PASSWORD: local-dev-only-change-me
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./app/frontend
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  pgdata:
